<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Sucesso</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .success-container {
      max-width: 700px;
      margin: 80px auto;
      text-align: center;
      padding: 30px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      background: #fafafa;
    }
    .success-title {
      font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
      font-size: 24px;
      color: #2e7d32;
      margin-bottom: 10px;
      font-weight: bold;
    }
    .success-sub {
      color: #555;
      margin-top: 8px;
    }
    .btn-back {
      display: inline-block;
      margin-top: 18px;
      padding: 10px 16px;
      background: #1976d2;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="success-container">
    <div class="success-title">Ocorrência Registrada com Sucesso!</div>
    <div class="success-sub">A ocorrência foi registrada no sistema.</div>
    <a class="btn-back" href="ocorrencias.html">Registrar nova ocorrência</a>
  </div>
</body>
</html>
